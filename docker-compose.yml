name: stray

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: /app/data/app.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a randomly generated secret of at least 32 characters}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      - ./backend/data:/app/data
      - uploads_data:/app/uploads

volumes:
  uploads_data:
