name: stray

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ./data/app.db
      JWT_SECRET: dev_secret_change_in_prod
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    command: sh -c "npm run db:migrate && npm run db:seed && npm run start"

volumes:
  uploads_data:
